# Este arquivo serve para quem publica o site conectando o repositório ao Netlify.
# (Para publicar o .zip manualmente, o Netlify usa os arquivos _redirects e _headers
#  que estão dentro da pasta publicada — eles já seguem o mesmo conteúdo daqui.)

[build]
  command = "npm run build:netlify"
  publish = ".build/netlify"

# Site de uma página só (React Router): toda rota cai no index.html,
# senão recarregar /cardapio ou /admin daria erro 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
